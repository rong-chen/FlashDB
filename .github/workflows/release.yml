name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build macOS (Apple Silicon)
        run: wails build -platform darwin/arm64

      - name: Create DMG
        run: |
          APP_PATH=$(find build/bin -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app found"
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p dist
          cp -r "$APP_PATH" dist/FlashDB.app
          hdiutil create -volname "FlashDB" -srcfolder dist -ov -format UDZO FlashDB-macos-arm64.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: FlashDB-macos-arm64.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build Windows with NSIS installer
        run: wails build -platform windows/amd64 -nsis

      - name: Find and rename installer
        run: |
          $installer = Get-ChildItem -Path build/bin -Filter "*-amd64-installer.exe" | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName -Destination "FlashDB-windows-installer.exe"
          } else {
            Write-Host "NSIS installer not found, creating ZIP instead"
            $exe = Get-ChildItem -Path build/bin -Filter "*.exe" | Where-Object { $_.Name -notlike "*-installer*" } | Select-Object -First 1
            if ($exe) {
              Compress-Archive -Path $exe.FullName -DestinationPath FlashDB-windows.zip
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            FlashDB-windows-installer.exe
            FlashDB-windows.zip
          if-no-files-found: warn

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List files
        run: find . -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            macos-builds/FlashDB-macos-arm64.dmg
            windows-builds/FlashDB-windows-installer.exe
            windows-builds/FlashDB-windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
